[[repos]]
repo = "builtin"
hooks = [
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = '\.(bat|cmd)$' },
]

[[repos]]
repo = "local"
hooks = [
  { id = "ruff-format", name = "ruff format", entry = "uv run ruff format", language = "system", types = ["python"] },
  { id = "ruff-check", name = "ruff check", entry = "uv run ruff check --fix", language = "system", types = ["python"] },
  { id = "ty", name = "ty check", entry = "uv run ty check", language = "system", types = ["python"], pass_filenames = false },
  { id = "actionlint", name = "actionlint", entry = "actionlint", language = "system", files = "^\\.github/workflows/" },
  { id = "zizmor", name = "zizmor", entry = "zizmor", language = "system", files = "^\\.github/" },
  { id = "agent-mail-guard", name = "agent-mail lease guard", entry = "pwsh -NoProfile -File tools/agent-mail-guard.ps1", language = "system", pass_filenames = true, stages = ["pre-commit"] },
]
